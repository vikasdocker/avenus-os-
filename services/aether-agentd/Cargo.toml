[package]
name = "aether-agentd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Aether Agent Daemon - AI control-plane agent with event ring buffer"

[[bin]]
name = "aether-agentd"
path = "src/main.rs"

[dependencies]
aether-core = { path = "../../core/aether-core" }
aether-sdk = { path = "../../sdk/rust/aether-sdk" }
aether-agent-runtime = { path = "../../agent/aether-agent-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true
