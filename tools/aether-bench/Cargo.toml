[package]
name = "aether-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Aether OS micro-benchmark harness for hot paths"

[[bin]]
name = "aether-bench"
path = "src/main.rs"

[dependencies]
aether-core = { path = "../../core/aether-core" }
aether-security = { path = "../../security/aether-security" }
aether-agent-core = { path = "../../agent/aether-agent-core" }
aether-device-core = { path = "../../agent/aether-device-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true
