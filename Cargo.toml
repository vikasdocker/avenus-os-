[workspace]
resolver = "2"
members = [
  "apps/aether-apps",
  "apps/aether-surface",
  "apps/calculator",
  "apps/notes",
  "core/aether-core",
  "security/aether-security",
  "security/aether-ai-defense",
  "storage/aether-storage",
  "system/aether-process-manager",
  "system/aether-init",
  "system/aether-system-core",
  "system/aether-application-manager",
  "system/aether-update-core",
  "system/aether-sandbox",
  "system/aether-store",
  "system/aether-diagnostics",
  "system/aether-recovery",
  "system/aether-automation",
  "system/aether-hardware-service",
  "agent/aether-agent-core",
  "agent/aether-device-core",
  "agent/aether-background-agent",
  "agent/aether-retry-policy",
  "network/aether-network",
  "services/aether-agentd",
  "services/aether-supervisor",
  "voice/aether-voice",
  "voice/aether-stt",
  "voice/aether-tts",
  "voice/aether-wake-word",
  "voice/aether-audio",
  "shell/aether-shell",
  "graphics/libaether-graphics",
  "graphics/aether-graphical-shell",
  "graphics/aether-wm",
  "sdk/rust/aether-sdk",
  "tools/aetherctl",
  "tools/aether-bench",
  "agent/aether-agent-runtime",
  "ui/aether-design-tokens",
  "ui/aether-ui-components",
  "ui/aether-launcher",
  "ui/aether-command-bar",
  "ui/aether-assistant",
  "ui/aether-icons",
  "ui/aether-animation",
  "ui/aether-a11y"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Project Genesis Contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
