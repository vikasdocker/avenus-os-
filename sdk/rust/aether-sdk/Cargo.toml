[package]
name = "aether-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Aether SDK - Rust client library for the Aether OS control plane"

[dependencies]
aether-core = { path = "../../../core/aether-core" }
aether-security = { path = "../../../security/aether-security" }
ed25519-dalek = { version = "3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = { version = "3" }
tempfile = "3"

[lints]
workspace = true
