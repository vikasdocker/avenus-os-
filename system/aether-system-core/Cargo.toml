[package]
name = "aether-system-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Aether System Core - service lifecycle owner for Aether OS"

[lib]
name = "aether_system_core"
path = "src/lib.rs"

[[bin]]
name = "aether-system-core"
path = "src/main.rs"

[dependencies]
aether-agent-core = { path = "../../agent/aether-agent-core" }
aether-application-manager = { path = "../aether-application-manager" }
aether-device-core = { path = "../../agent/aether-device-core" }
aether-core = { path = "../../core/aether-core" }
aether-security = { path = "../../security/aether-security" }
aether-storage = { path = "../../storage/aether-storage" }
aether-update-core = { path = "../aether-update-core" }
ed25519-dalek = "3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
