[package]
name = "aether-application-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Aether Application Manager - app registry and launch lifecycle"

[lib]
name = "aether_application_manager"
path = "src/lib.rs"

[[bin]]
name = "aether-application-manager"
path = "src/main.rs"

[dependencies]
aether-apps = { path = "../../apps/aether-apps" }
aether-core = { path = "../../core/aether-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
