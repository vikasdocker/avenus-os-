[package]
name = "aether-ai-defense"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Aether AI security: prompt-injection defenses, output validation, privilege boundary, and audit trail. Every piece of untrusted content (file reads, web fetches, app IPC, peer messages) is sanitized before it reaches the model; every model-emitted action is validated against a typed privilege ceiling before the shell executes it."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
