[package]
name = "aether-shell"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "aethersh"
path = "src/main.rs"

[dependencies]
aether-core = { path = "../../core/aether-core" }
aether-network = { path = "../../network/aether-network" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"

[dev-dependencies]
tempfile = "3"
